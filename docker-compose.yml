services:
  coordinator:
    build: .
    container_name: minigoogle-coordinator
    ports:
      - "8080:8080"
    environment:
      - NODE_TYPE=coordinator
      - NODE_PORT=8080
      - CLUSTER_PEERS=search-node-1:8080,search-node-2:8080
    networks:
      - minigoogle-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  search-node-1:
    build: .
    container_name: minigoogle-search-node-1
    ports:
      - "8081:8080"
    environment:
      - NODE_TYPE=search-node
      - NODE_PORT=8080
      - CLUSTER_PEERS=coordinator:8080,search-node-2:8080
    networks:
      - minigoogle-net
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  search-node-2:
    build: .
    container_name: minigoogle-search-node-2
    ports:
      - "8082:8080"
    environment:
      - NODE_TYPE=search-node
      - NODE_PORT=8080
      - CLUSTER_PEERS=coordinator:8080,search-node-1:8080
    networks:
      - minigoogle-net
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  monitoring:
    build: .
    container_name: minigoogle-monitoring
    ports:
      - "9090:8080"
    environment:
      - NODE_TYPE=monitoring
      - NODE_PORT=8080
      - CLUSTER_PEERS=coordinator:8080,search-node-1:8080,search-node-2:8080
    networks:
      - minigoogle-net
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy

networks:
  minigoogle-net:
    driver: bridge
