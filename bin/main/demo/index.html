<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniGoogle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; color: #202124; min-height: 100vh;
    display: flex; flex-direction: column; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .home { padding-top: 14vh; }
  .logo { font-size: 64px; font-weight: bold; margin-bottom: 24px; }
  .logo .m { color: #4285f4; }
  .logo .i { color: #ea4335; }
  .logo .n { color: #fbbc05; }
  .logo .g { color: #4285f4; }
  .logo .o { color: #34a853; }
  .logo .g2 { color: #ea4335; }
  .logo .l { color: #4285f4; }
  .logo .e { color: #ea4335; }
  .search-box { width: 584px; max-width: 90vw; position: relative; }
  .search-box input {
    width: 100%; padding: 14px 48px 14px 18px; border: 1px solid #dfe1e5;
    border-radius: 24px; font-size: 16px; outline: none;
    box-shadow: 0 1px 6px rgba(32,33,36,.15);
  }
  .search-box input:focus { box-shadow: 0 1px 6px rgba(32,33,36,.3); border-color: transparent; }
  .search-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 8px;
  }
  .search-btn svg { width: 20px; height: 20px; fill: #4285f4; }
  .buttons { margin-top: 28px; display: flex; gap: 12px; }
  .buttons button {
    padding: 10px 20px; border: 1px solid #dfe1e5; border-radius: 4px;
    background: #f8f9fa; font-size: 14px; cursor: pointer; color: #3c4043;
  }
  .buttons button:hover { border-color: #c0c0c0; box-shadow: 0 1px 2px rgba(0,0,0,.1); }

  /* Autocomplete dropdown */
  .autocomplete { position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
    background: #fff; border: 1px solid #dfe1e5; border-radius: 0 0 24px 24px;
    box-shadow: 0 4px 6px rgba(0,0,0,.15); display: none; overflow: hidden; margin-top: -1px; }
  .autocomplete-item { padding: 10px 18px; cursor: pointer; font-size: 15px; color: #202124;
    display: flex; align-items: center; }
  .autocomplete-item:hover, .autocomplete-item.active { background: #f0f6ff; }
  .ac-icon { width: 16px; height: 16px; fill: #9aa0a6; margin-right: 12px; flex-shrink: 0; }

  /* Add URL section */
  .add-url { margin-top: 20px; display: flex; gap: 8px; align-items: center; }
  .add-url input {
    padding: 8px 14px; border: 1px solid #dfe1e5; border-radius: 4px;
    font-size: 13px; width: 360px; max-width: 70vw; outline: none;
  }
  .add-url input:focus { border-color: #4285f4; }
  .add-url button {
    padding: 8px 16px; border: none; border-radius: 4px;
    background: #4285f4; color: #fff; font-size: 13px; cursor: pointer;
  }
  .add-url button:hover { background: #3367d6; }
  .add-url .status { font-size: 12px; color: #70757a; margin-left: 8px; }

  /* Index stats on home */
  .index-stats { margin-top: 28px; display: flex; gap: 24px; color: #70757a; font-size: 13px; }
  .index-stats .stat { text-align: center; }
  .index-stats .stat-val { font-size: 20px; font-weight: bold; color: #4285f4; }

  /* Results page */
  .results-page { display: none; padding: 20px 0; flex: 1; flex-direction: column; min-height: 0; }
  .results-page .top-bar {
    display: flex; align-items: center; padding: 12px 20px;
    border-bottom: 1px solid #dfe1e5;
  }
  .results-page .top-bar .logo-sm { font-size: 28px; font-weight: bold; cursor: pointer; }
  .results-page .top-bar .search-box { width: 100%; max-width: 600px; margin-left: 24px; }
  .results-page .top-bar .search-box input { padding: 10px 44px 10px 14px; font-size: 14px; }
  .results-stats { padding: 8px 20px 0 176px; color: #70757a; font-size: 13px; }
  .did-you-mean { padding: 4px 20px 0 176px; color: #4285f4; font-size: 14px; cursor: pointer; }
  .did-you-mean:hover { text-decoration: underline; }
  .result { padding: 8px 20px 8px 176px; max-width: 700px; }
  .result .url { font-size: 13px; color: #202124; margin-bottom: 2px; }
  .result .title { font-size: 18px; }
  .result .title a { color: #1a0dab; text-decoration: none; }
  .result .title a:hover { text-decoration: underline; }
  .result .snippet { font-size: 14px; color: #4d5156; line-height: 1.5; margin-top: 4px; }
  .result .snippet b { font-weight: 700; }
  .result .score { font-size: 12px; color: #70757a; margin-top: 2px; }
  .no-results { padding: 40px 176px; color: #70757a; font-size: 16px; }
  .loading { padding: 20px 176px; color: #70757a; }
  .loading .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #dfe1e5;
    border-top-color: #4285f4; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Analytics bar */
  .analytics-bar { padding: 8px 20px 0 176px; display: flex; gap: 20px; color: #70757a; font-size: 12px; }
  .analytics-bar span { color: #4285f4; font-weight: bold; }

  .footer { margin-top: auto; padding: 20px; text-align: center; color: #70757a; font-size: 13px;
    border-top: 1px solid #dfe1e5; }
</style>
</head>
<body>

<!-- HOME PAGE -->
<div id="home" class="center home">
  <div class="logo">
    <span class="m">M</span><span class="i">i</span><span class="n">n</span><span class="g">i</span><span class="o">G</span><span class="g2">o</span><span class="l">o</span><span class="e">g</span><span class="m">l</span><span class="i">e</span>
  </div>
  <div class="search-box">
    <form onsubmit="doSearch(); return false;">
      <input id="q1" type="text" autofocus autocomplete="off"
             oninput="onInput(this)" onkeydown="onKeydown(event, this)">
      <button class="search-btn" type="submit">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </form>
    <div id="ac1" class="autocomplete"></div>
  </div>
  <div class="buttons">
    <button type="button" onclick="doSearch()">MiniGoogle Search</button>
    <button type="button" onclick="doSearch()">I'm Feeling Lucky</button>
  </div>
  <div class="add-url">
    <input id="urlInput" type="url" placeholder="Add a URL to the index (e.g. https://example.com/page)">
    <button onclick="addUrl()">Add</button>
    <span id="addUrlStatus" class="status"></span>
  </div>
  <div class="index-stats" id="homeStats"></div>
</div>

<!-- RESULTS PAGE -->
<div id="results" class="results-page">
  <div class="top-bar">
    <div class="logo-sm" onclick="showHome()">
      <span class="m">M</span><span class="i">i</span><span class="n">n</span><span class="g">i</span><span class="o">G</span><span class="g2">o</span><span class="l">o</span><span class="e">g</span><span class="m">l</span><span class="i">e</span>
    </div>
    <div class="search-box">
      <form onsubmit="doSearch(); return false;">
        <input id="q2" type="text" autocomplete="off"
               oninput="onInput(this)" onkeydown="onKeydown(event, this)">
        <button class="search-btn" type="submit">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
      <div id="ac2" class="autocomplete"></div>
    </div>
  </div>
  <div id="didYouMean" class="did-you-mean" style="display:none;"></div>
  <div id="stats" class="results-stats"></div>
  <div id="analyticsBar" class="analytics-bar" style="display:none;"></div>
  <div id="resultList"></div>
  <div id="noResults" class="no-results" style="display:none;"></div>
</div>

<div class="footer">MiniGoogle &mdash; A distributed search engine built from scratch</div>

<script>
var acIndex = -1, acItems = [], acTimer = null;

function showHome() {
  document.getElementById('home').style.display = 'flex';
  document.getElementById('results').style.display = 'none';
  document.getElementById('q1').value = '';
  document.getElementById('q1').focus();
  hideAutocomplete('ac1');
}

function showResults() {
  document.getElementById('home').style.display = 'none';
  document.getElementById('results').style.display = 'flex';
}

function getActiveInput() {
  return document.getElementById('home').style.display !== 'none'
    ? document.getElementById('q1') : document.getElementById('q2');
}
function getActiveAC() {
  return document.getElementById('home').style.display !== 'none'
    ? document.getElementById('ac1') : document.getElementById('ac2');
}

async function onInput(el) {
  clearTimeout(acTimer);
  var q = el.value.trim();
  if (q.length < 2) { hideAutocomplete(getActiveAC().id); return; }
  acTimer = setTimeout(async function() {
    try {
      var resp = await fetch('/api/v1/suggest?q=' + encodeURIComponent(q));
      var suggestions = await resp.json();
      showAutocomplete(el, suggestions, q);
    } catch(e) {}
  }, 150);
}

function onKeydown(e, el) {
  var ac = getActiveAC();
  if (ac.style.display === 'block') {
    if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex + 1, acItems.length - 1); highlightAC(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); highlightAC(); }
    else if (e.key === 'Enter' && acIndex >= 0) { e.preventDefault(); el.value = acItems[acIndex]; hideAutocomplete(ac.id); doSearch(); }
    else if (e.key === 'Escape') { hideAutocomplete(ac.id); }
  }
}

function showAutocomplete(el, items, query) {
  var ac = getActiveAC();
  if (!items || items.length === 0) { hideAutocomplete(ac.id); return; }
  var q = query.toLowerCase();
  items.sort(function(a, b) {
    var al = a.toLowerCase(), bl = b.toLowerCase();
    var aExact = al === q ? 1 : 0, bExact = bl === q ? 1 : 0;
    if (aExact !== bExact) return bExact - aExact;
    var aStarts = al.startsWith(q) ? 1 : 0, bStarts = bl.startsWith(q) ? 1 : 0;
    if (aStarts !== bStarts) return bStarts - aStarts;
    var aRatio = q.length / a.length, bRatio = q.length / b.length;
    if (aRatio !== bRatio) return bRatio - aRatio;
    return a.localeCompare(b);
  });
  acItems = items; acIndex = -1;
  var svg = '<svg class="ac-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>';
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var highlighted = item.replace(new RegExp('^' + escapeRegex(query), 'i'), '<b>$&</b>');
    html += '<div class="autocomplete-item" onclick="selectAC(\'' + escapeHtml(item).replace(/'/g, "\\'") + '\')">' + svg + '<span>' + highlighted + '</span></div>';
  }
  ac.innerHTML = html;
  ac.style.display = 'block';
}

function hideAutocomplete(id) {
  document.getElementById(id).style.display = 'none';
  acItems = []; acIndex = -1;
}

function highlightAC() {
  var items = document.querySelectorAll('#ac1 .autocomplete-item, #ac2 .autocomplete-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', i === acIndex);
  }
}

function selectAC(val) {
  var el = getActiveInput();
  el.value = val;
  hideAutocomplete(getActiveAC().id);
  doSearch();
}

async function doSearch() {
  var active = getActiveInput();
  var q = active.value;
  if (!q.trim()) return;
  document.getElementById('q1').value = q;
  document.getElementById('q2').value = q;
  showResults();
  document.getElementById('resultList').innerHTML =
    '<div class="loading"><span class="spinner"></span>Searching...</div>';
  document.getElementById('noResults').style.display = 'none';
  document.getElementById('stats').textContent = '';
  document.getElementById('didYouMean').style.display = 'none';

  try {
    var resp = await fetch('/api/v1/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q, page: 1, pageSize: 20})
    });
    var data = await resp.json();
    renderResults(data, q);
    loadAnalytics();
  } catch (e) {
    document.getElementById('resultList').innerHTML =
      '<div class="no-results">Error: ' + e.message + '</div>';
  }
}

function renderResults(data, query) {
  var list = document.getElementById('resultList');
  var noRes = document.getElementById('noResults');
  var stats = document.getElementById('stats');
  var dim = document.getElementById('didYouMean');

  if (!data.results || data.results.length === 0) {
    list.innerHTML = '';
    noRes.style.display = 'block';
    noRes.innerHTML = 'Your search did not match any documents.<br>Try different keywords or check spelling.';
    stats.textContent = '';
    if (data.didYouMean) {
      dim.style.display = 'block';
      dim.innerHTML = 'Did you mean: <b>' + escapeHtml(data.didYouMean) + '</b>';
      dim.onclick = function() {
        document.getElementById('q2').value = data.didYouMean;
        doSearch();
      };
    }
    return;
  }

  dim.style.display = 'none';
  noRes.style.display = 'none';
  stats.textContent = 'About ' + data.totalResults + ' results (' + data.executionTimeMs + ' ms)';

  var html = '';
  for (var i = 0; i < data.results.length; i++) {
    var r = data.results[i];
    var snippet = r.snippet || '';
    html += '<div class="result">';
    html += '<div class="url">' + escapeHtml(r.url) + '</div>';
    html += '<div class="title"><a href="' + escapeHtml(r.url) + '" target="_blank">' + escapeHtml(r.title) + '</a></div>';
    html += '<div class="snippet">' + highlightSnippet(snippet) + '</div>';
    var bm25 = (r.bm25Score || 0) > 0 ? 'BM25: ' + (r.bm25Score * 100).toFixed(1) + '%' : '';
    var pr = (r.pageRankScore || 0) > 0 ? 'PageRank: ' + (r.pageRankScore * 100).toFixed(1) + '%' : '';
    var parts = [];
    if (bm25) parts.push(bm25);
    if (pr) parts.push(pr);
    parts.push('Score: ' + (r.score * 100).toFixed(1) + '%');
    html += '<div class="score">' + escapeHtml(parts.join(' \u00b7 ')) + '</div>';
    html += '</div>';
  }
  list.innerHTML = html;
}

function highlightSnippet(text) {
  return text.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Load index stats on home page
async function loadStats() {
  try {
    var resp = await fetch('/api/v1/stats');
    var s = await resp.json();
    document.getElementById('homeStats').innerHTML =
      '<div class="stat"><div class="stat-val">' + s.documentCount + '</div>Documents</div>' +
      '<div class="stat"><div class="stat-val">' + s.vocabularySize + '</div>Terms</div>' +
      '<div class="stat"><div class="stat-val">' + s.averageDocumentLength + '</div>Avg Words</div>';
  } catch(e) {}
}
loadStats();

// Load analytics on results page
async function loadAnalytics() {
  try {
    var resp = await fetch('/api/v1/analytics');
    var a = await resp.json();
    var bar = document.getElementById('analyticsBar');
    if (a.totalQueries > 0) {
      bar.style.display = 'flex';
      bar.innerHTML = '<div>Queries: <span>' + a.totalQueries + '</span></div>' +
        '<div>Avg latency: <span>' + a.averageLatencyMs.toFixed(1) + ' ms</span></div>' +
        '<div>Zero-result rate: <span>' + (a.zeroResultRate * 100).toFixed(0) + '%</span></div>';
    }
  } catch(e) {}
}

// Add URL to index
async function addUrl() {
  var input = document.getElementById('urlInput');
  var status = document.getElementById('addUrlStatus');
  var url = input.value.trim();
  if (!url) return;
  status.textContent = 'Crawling...';
  status.style.color = '#70757a';
  try {
    var resp = await fetch('/api/v1/crawl', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url})
    });
    var data = await resp.json();
    if (data.success) {
      status.textContent = 'Added: ' + (data.title || url);
      status.style.color = '#34a853';
      input.value = '';
      loadStats();
    } else {
      status.textContent = 'Error: ' + (data.error || 'failed');
      status.style.color = '#ea4335';
    }
  } catch(e) {
    status.textContent = 'Error: ' + e.message;
    status.style.color = '#ea4335';
  }
}

// Close autocomplete on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-box')) {
    hideAutocomplete('ac1'); hideAutocomplete('ac2');
  }
});
</script>
</body>
</html>
