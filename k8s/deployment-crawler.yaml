# Crawler deployment - handles web crawling and content fetching
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minigoogle-crawler
  namespace: minigoogle
  labels:
    app.kubernetes.io/name: minigoogle
    app.kubernetes.io/component: crawler
    app.kubernetes.io/part-of: minigoogle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minigoogle
      app.kubernetes.io/component: crawler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minigoogle
        app.kubernetes.io/component: crawler
        app.kubernetes.io/part-of: minigoogle
    spec:
      containers:
        - name: minigoogle-crawler
          image: ghcr.io/Yasser-Ameur-Dev/distributed-search-engine:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: minigoogle-config
          env:
            - name: NODE_TYPE
              value: crawler
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
