# Ingress to expose the coordinator service externally
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minigoogle-ingress
  namespace: minigoogle
  labels:
    app.kubernetes.io/name: minigoogle
    app.kubernetes.io/part-of: minigoogle
spec:
  ingressClassName: nginx
  rules:
    - host: minigoogle.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minigoogle-coordinator
                port:
                  number: 8080
