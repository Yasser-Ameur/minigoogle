# Coordinator node deployment - manages cluster coordination and API routing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minigoogle-coordinator
  namespace: minigoogle
  labels:
    app.kubernetes.io/name: minigoogle
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: minigoogle
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: minigoogle
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minigoogle
        app.kubernetes.io/component: coordinator
        app.kubernetes.io/part-of: minigoogle
    spec:
      containers:
        - name: minigoogle-coordinator
          image: ghcr.io/Yasser-Ameur-Dev/distributed-search-engine:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: minigoogle-config
          env:
            - name: NODE_TYPE
              value: coordinator
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
