# NetworkPolicy restricting inter-pod communication to only minigoogle-labeled pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minigoogle-network-policy
  namespace: minigoogle
  labels:
    app.kubernetes.io/name: minigoogle
    app.kubernetes.io/part-of: minigoogle
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minigoogle
  egress:
    - {}
