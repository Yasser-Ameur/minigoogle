# Search node deployment - handles search queries and indexing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minigoogle-search-node
  namespace: minigoogle
  labels:
    app.kubernetes.io/name: minigoogle
    app.kubernetes.io/component: search-node
    app.kubernetes.io/part-of: minigoogle
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: minigoogle
      app.kubernetes.io/component: search-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minigoogle
        app.kubernetes.io/component: search-node
        app.kubernetes.io/part-of: minigoogle
    spec:
      containers:
        - name: minigoogle-search-node
          image: ghcr.io/Yasser-Ameur-Dev/distributed-search-engine:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: minigoogle-config
          env:
            - name: NODE_TYPE
              value: search-node
            - name: NODE_PORT
              value: "8080"
          resources:
            requests:
              memory: 1Gi
              cpu: 1000m
            limits:
              memory: 1Gi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
