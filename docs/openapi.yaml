openapi: 3.0.3
info:
  title: MiniGoogle API
  version: "1.0.0"
  description: >
    REST API served by com.minigoogle.demo.MiniGoogleApp. Routes below are
    those a STANDALONE (the default docker image), SEARCH, or CLUSTER node
    registers. A COORDINATOR node (node.type=COORDINATOR) serves a reduced
    surface: it has no local index, so /api/v1/entities is absent,
    /api/v1/suggest and /api/v1/stats answer with empty payloads, and POST
    /api/v1/crawl always returns 501 NOT_SUPPORTED without attempting to
    fetch anything. It does register /api/v1/health/ready (answering the same
    200 as /api/v1/health, since it has no local index to be not-ready
    about). It additionally serves GET /api/v1/cluster/state instead of the
    cluster routes below. A CLUSTER node additionally serves the two
    /api/v1/cluster/* routes documented here.


    Two error responses apply to every path, matched or not, and aren't
    listed per operation below: any path that doesn't match a route in this
    document gets 404 NOT_FOUND (see components.responses.NotFound), and a
    CORS preflight from a disallowed origin gets 403 FORBIDDEN_ORIGIN (see
    components.responses.ForbiddenOrigin and the README's CORS section) when
    server.cors.origins is a list rather than "*".
servers:
  - url: http://localhost:8080

security:
  - {}

paths:
  /:
    get:
      summary: Web UI
      description: Serves the built single-page frontend.
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}

  /api/v1/health:
    get:
      summary: Liveness
      description: Always answers 200 while the process is up; does not check the index.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"

  /api/v1/health/ready:
    get:
      summary: Readiness
      description: >
        200 once the index is loaded and can serve search, 503 NOT_READY
        while it is still building or after it fails to load. A COORDINATOR
        node has no local index and always answers 200 here, the same as
        /api/v1/health.
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/version:
    get:
      summary: Build version
      responses:
        "200":
          description: Running version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "1.0.0"

  /metrics:
    get:
      summary: Prometheus metrics
      description: >
        Prometheus text exposition format 0.0.4. Includes
        minigoogle_build_info, process_uptime_seconds, jvm_memory_used_bytes,
        jvm_threads_current, minigoogle_http_requests_total,
        minigoogle_http_request_duration_seconds,
        minigoogle_search_duration_seconds, minigoogle_search_queries_total,
        minigoogle_search_zero_result_queries_total, and
        minigoogle_index_documents. Protected the same way as
        POST /api/v1/crawl; open when no API key is configured.
      security:
        - apiKey: []
      responses:
        "200":
          description: Metrics snapshot
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/search:
    post:
      summary: Search the index
      description: >
        page and pageSize are accepted and echoed on the response (page
        defaults to 1, pageSize defaults to 10 and is clamped to 1..100).
        offset = (page-1)*pageSize; the server retrieves offset+pageSize
        candidates deep and totalResults counts matches found within that
        depth, not an exhaustive corpus count. Only a repeated page:1 query
        served from the query cache is reliably sliced to the requested
        page; a cache miss returns the full depth unsliced with page/pageSize
        echoed as 1/<actual result count> regardless of what was requested.
        A SEARCH-mode node ignores page. A COORDINATOR node echoes
        page/pageSize but can only ever serve page 1's results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                page:
                  type: integer
                  description: 1-indexed; values below 1 are treated as 1
                pageSize:
                  type: integer
                  description: Defaults to 10 if below 1; clamped to 100 if above
              required: [query]
      responses:
        "200":
          description: Ranked results (empty list for a blank query)
          content:
            application/json: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/suggest:
    get:
      summary: Autocomplete
      description: Falls back to spell-corrected suggestions when the raw prefix has none.
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Up to 8 suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/stats:
    get:
      summary: Index statistics
      responses:
        "200":
          description: Document count, vocabulary size, average document length, index version
          content:
            application/json: {}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/analytics:
    get:
      summary: Query analytics
      responses:
        "200":
          description: Total queries, average latency, zero-result rate, top queries
          content:
            application/json: {}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/click:
    post:
      summary: Record a result click for learning-to-rank feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                documentId:
                  type: integer
                url:
                  type: string
                position:
                  type: integer
                sessionId:
                  type: string
              required: [query]
      responses:
        "200":
          description: "{success, documentId, position, trainedPairs}"
          content:
            application/json: {}
        "400":
          description: Malformed JSON body, missing query, or a click that matches no local document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: No index loaded yet (NOT_READY), or the request queue is full (SERVICE_BUSY, Retry-After 1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/ml/stats:
    get:
      summary: Learning-to-rank model and click statistics
      responses:
        "200":
          description: Feature names, model weights, click and impression counts
          content:
            application/json: {}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/entities:
    get:
      summary: Knowledge graph entities
      description: Not served by a COORDINATOR node.
      parameters:
        - name: q
          in: query
          description: Substring filter; empty returns the top 20 entities by document count
          schema:
            type: string
      responses:
        "200":
          description: Matching entities with their related entities
          content:
            application/json: {}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/crawl:
    post:
      summary: Fetch a URL, parse it, and add it to the index
      description: >
        On a COORDINATOR node (no local index) this always answers
        501 NOT_SUPPORTED without attempting anything.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
              required: [url]
      responses:
        "200":
          description: "{success:true, title, url}"
          content:
            application/json: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Page was fetched but could not be parsed (PARSE_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          description: Node is a COORDINATOR; it has no local index to crawl into (NOT_SUPPORTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The URL could not be fetched (FETCH_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/cluster/status:
    get:
      summary: Raft/gossip state of this cluster member (CLUSTER node only)
      responses:
        "200":
          description: nodeId, Raft state, term, leader, commit index, members, live nodes
          content:
            application/json: {}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

  /api/v1/cluster/kv:
    get:
      summary: Read a replicated key (CLUSTER node only)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{found, key, value} or {found:false, error}"
          content:
            application/json: {}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"
    post:
      summary: Write a key through Raft (CLUSTER node only)
      description: Returns only once a majority of the cluster has committed and applied the entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
              required: [key]
      responses:
        "200":
          description: "{success:true, key} or {success:false, error, leader}"
          content:
            application/json: {}
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceBusy"
        "504":
          $ref: "#/components/responses/HandlerTimeout"

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        The API key configured via MINIGOGLE_API_KEY / security.apiKey. An
        "Authorization: Bearer <key>" header is accepted in place of
        X-API-Key. When no key is configured, protected routes are open.
  responses:
    BadRequest:
      description: Malformed request body or missing/invalid required field (BAD_REQUEST)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        Path does not match any registered route (NOT_FOUND). Not tied to a
        specific operation below; any path outside this document's paths
        gets this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenOrigin:
      description: >
        CORS preflight (OPTIONS) from an Origin not present in
        server.cors.origins, when that setting is a comma-separated list
        rather than "*" (FORBIDDEN_ORIGIN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceBusy:
      description: >
        The request queue (server.maxThreads workers plus a 4x queue) is
        full (SERVICE_BUSY)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Always "1"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Wrong HTTP method for this route
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeded server.maxBodyBytes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Client exceeded server.rateLimit.perSecond (only returned when a rate limit is configured)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HandlerTimeout:
      description: Handler exceeded server.requestTimeoutMs
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
        requestId:
          type: string
      required: [error, requestId]
    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
        version:
          type: string
        uptimeSeconds:
          type: integer
        checks:
          type: object
      required: [status, version, uptimeSeconds, checks]
