# MiniGoogle application configuration.
# Loaded by ConfigurationLoader at startup. Overridable via environment
# variables: NODE_TYPE, NODE_PORT, CLUSTER_PEERS, MINIGOGLE_* (see ConfigurationLoader).

node:
  type: STANDALONE        # STANDALONE | SEARCH | COORDINATOR

server:
  port: 8080
  host: 0.0.0.0

cluster:
  replicationFactor: 3
  nodeTimeout: 30000
  gossipInterval: 1000
  port: 8081              # COORDINATOR: cluster registry port
  # coordinatorUrl: http://localhost:8081   # defaults to cluster.port when unset
  advertisedHost: localhost

crawler:
  workers: 32
  maxDepth: 5
  politenessDelay: 1000

search:
  topK: 20
  maxResults: 100
  timeoutMs: 5000

semantic:
  enabled: true            # build the content-based vector index and rerank by cosine
  dimension: 128           # embedding dimensionality (feature hashing bucket count)
  weight: 0.3              # blend weight: 0 = pure lexical, 1 = pure semantic
  expansion:
    enabled: true          # corpus-derived PMI query expansion
    windowSize: 10         # co-occurrence window length in tokens
    pmiThreshold: 1.0      # minimum PMI for a thesaurus edge
    maxNeighbors: 5        # max expansion terms per term
  hybrid:
    enabled: true          # merge lexical and vector recall at search time
    lexicalWeight: 0.5     # weight of lexical scores in the blended merge
    fetchK: 60             # number of semantic candidates fetched
  knowledge:
    enabled: true          # build the corpus knowledge graph
    maxEntitiesPerDoc: 10  # entities extracted per document
    maxRelated: 8          # related entities returned per entity

indexing:
  indexDir: demo-index
  segmentSize: 10000
  compactionThreshold: 5

ml:
  ltr:
    enabled: true           # re-rank search results with the learned model
    epochs: 3               # pairwise training epochs per feedback round
    learningRate: 0.05      # gradient descent step for pairwise training
  click:
    enabled: true           # record clicks and feed them back into the model
    trainAfterClicks: 25    # retrain after this many new clicks

logging:
  level: INFO
  format: json
